syntax = "proto3";

package madtom.v1;

import "madtom/v1/logs.proto";
import "madtom/v1/query.proto";

option go_package = "github.com/DarkDuck007/madtom/pkg/proto/v1;madtomv1";
option csharp_namespace = "MADTOM.Plugins.NoxAI.Proto.V1";

// ==============================================================================
// NoxChatControlService
// Full control plane for NoxAI / NoxChat node administration, telemetry,
// direct interaction, memories, libraries, raw API payloads, and jobs.
// ==============================================================================
service NoxChatControlService {
  // Handshake, Node Info, Transport Compression Stats, and Live Config
  rpc GetNodeStatus(NoxNodeStatusRequest) returns (NoxNodeStatusResponse);
  rpc UpdateControlConfig(NoxUpdateControlConfigRequest) returns (NoxNodeStatusResponse);

  // Asynchronous Zstd-Chunked Live Streams (1MB State/Telemetry Buffer / 8MB Log/API Buffer)
  rpc SubscribeState(NoxStateSubscriptionRequest) returns (stream NoxStateChunk);
  rpc SubscribeLogsAndApi(NoxLogApiSubscriptionRequest) returns (stream NoxLogApiChunk);

  // Historical Usage & Python Runtime Telemetry Query (LTTB Downsampled for MetricHistoryChartControl)
  rpc QueryTelemetryRange(RangeQueryRequest) returns (RangeQueryResponse);

  // Historical Spool Paging (from 1GB Server-Side WAL Spool when store_raw_logs is enabled)
  rpc GetSpoolStats(NoxSpoolStatsRequest) returns (NoxSpoolStatsResponse);
  rpc QueryLogChunks(LogChunkQuery) returns (LogChunkResponse);
  rpc QueryApiCallChunks(NoxApiCallChunkQuery) returns (NoxApiCallChunkResponse);

  // Direct Chat Interaction (User: "MADTOM", UserID: "Control Center")
  rpc SendDirectMessage(NoxDirectMessageRequest) returns (stream NoxDirectTurnEvent);
  rpc GetChatHistory(NoxChatHistoryRequest) returns (NoxChatHistoryResponse);
  rpc ListChats(NoxListChatsRequest) returns (NoxListChatsResponse);

  // RAG, Atomic Memories & Hot Memory Inspection + Modification
  rpc QueryMemories(NoxMemoryQueryRequest) returns (NoxMemoryQueryResponse);
  rpc SearchMemoriesHybrid(NoxHybridSearchRequest) returns (NoxHybridSearchResponse);
  rpc UpsertMemory(NoxUpsertMemoryRequest) returns (NoxMemoryMutationResponse);
  rpc DeleteMemory(NoxDeleteMemoryRequest) returns (NoxMemoryMutationResponse);
  rpc ListHotMemories(NoxHotMemoryRequest) returns (NoxHotMemoryResponse);
  rpc UpsertHotMemory(NoxUpsertHotMemoryRequest) returns (NoxHotMemoryResponse);
  rpc DeleteHotMemory(NoxDeleteHotMemoryRequest) returns (NoxHotMemoryResponse);

  // Stickers, GIFs, Libraries & Vector Inspection + Modification
  rpc QueryMediaLibrary(NoxMediaQueryRequest) returns (NoxMediaQueryResponse);
  rpc GetMediaAssetPreview(NoxMediaPreviewRequest) returns (NoxMediaPreviewResponse);
  rpc MutateMediaItem(NoxMediaMutationRequest) returns (NoxMediaMutationResponse);
  rpc ManageMediaPin(NoxMediaPinRequest) returns (NoxMediaMutationResponse);
  rpc TriggerStickerPackAnalysis(NoxAnalyzePackRequest) returns (NoxAnalyzePackResponse);
  rpc ForceAddSticker(NoxForceAddStickerRequest) returns (NoxMediaMutationResponse);

  // Active Jobs & Vector Store Explorer
  rpc GetActiveJobs(NoxActiveJobsRequest) returns (NoxActiveJobsResponse);
  rpc InspectVectors(NoxVectorInspectRequest) returns (NoxVectorInspectResponse);
}

// ------------------------------------------------------------------------------
// Node Status & Config
// ------------------------------------------------------------------------------
message NoxNodeStatusRequest {
  string node_id = 1;
}

message NoxNodeStatusResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  string hostname = 2;
  string noxchat_version = 3;
  string probe_version = 4;
  string python_version = 5;
  int64 uptime_seconds = 6;
  bool bot_running = 7;
  bool store_raw_logs = 8;
  uint64 max_spool_bytes = 9;
  uint64 current_spool_bytes = 10;
  uint64 state_buffer_bytes = 11;
  uint64 log_buffer_bytes = 12;
  repeated TransportCompressionStats transport_stats = 13;
}

message NoxUpdateControlConfigRequest {
  string node_id = 1;
  bool store_raw_logs = 2;
  uint64 max_spool_bytes = 3;
}

// ------------------------------------------------------------------------------
// Streamed Chunks
// ------------------------------------------------------------------------------
message NoxStateSubscriptionRequest {
  string node_id = 1;
}

// Zstd-compressed batch of state, telemetry, and job progress events (1MB buffer cap)
message NoxStateChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  int64 timestamp_unix_nano = 3;
  bytes zstd_payload = 4;       // Compressed NoxStateChunkPayload
  uint32 decoded_size = 5;
  uint64 dropped_chunks = 6;    // Non-zero if slow consumer caused ring buffer drops
}

message NoxStateChunkPayload {
  repeated NoxTelemetrySample telemetry_samples = 1;
  repeated NoxJobProgressEvent job_events = 2;
  repeated NoxTurnTagEvent live_turn_events = 3;
}

message NoxLogApiSubscriptionRequest {
  string node_id = 1;
  bool include_raw_api_calls = 2;
  bool include_images = 3;
}

// Zstd-compressed batch of system/bot logs and raw LLM API calls (8MB buffer cap)
message NoxLogApiChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  int64 timestamp_unix_nano = 3;
  bytes zstd_payload = 4;       // Compressed LogChunk or NoxApiCallChunk
  uint32 decoded_size = 5;
  uint64 dropped_chunks = 6;
  string chunk_kind = 7;        // "log" or "api"
}

message NoxLogApiChunkPayload {
  repeated LogRecord log_records = 1;
  repeated NoxRawApiCallRecord api_call_records = 2;
}

// ------------------------------------------------------------------------------
// Telemetry & Usage Metrics
// ------------------------------------------------------------------------------
message NoxTelemetrySample {
  int64 timestamp_unix_nano = 1;
  map<string, double> metrics = 2;
}

// ------------------------------------------------------------------------------
// Raw LLM API Call Inspection (with Multimodal Image Support)
// ------------------------------------------------------------------------------
message NoxRawApiCallRecord {
  string call_id = 1;
  int64 timestamp_unix_nano = 2;
  string caller = 3;            // "main_agent", "sticker_map", "sticker_reduce", "memory_retry", "audio_status"
  string model = 4;
  string base_url = 5;
  double temperature = 6;
  uint32 duration_ms = 7;
  uint32 prompt_tokens = 8;
  uint32 completion_tokens = 9;
  uint32 cached_tokens = 10;
  string raw_request_json = 11;
  string raw_response_json = 12;
  repeated NoxImageData image_data_urls = 13; // extracted base64 JPEG data URIs
  string error_message = 14;
}

message NoxImageData {
  string label = 1;             // e.g. "User Photo #142", "Sticker Map 2x2 Grid"
  string mime_type = 2;         // "image/jpeg", "image/png"
  bytes image_bytes = 3;        // decoded binary image for fast client rendering
}

message NoxSpoolStatsRequest {
  string node_id = 1;
}

message NoxSpoolStatsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  uint64 total_spool_bytes = 2;
  uint64 max_spool_bytes = 3;
  uint64 total_log_records = 4;
  uint64 total_api_calls = 5;
  int64 oldest_ts_unix_nano = 6;
  int64 newest_ts_unix_nano = 7;
}

message NoxApiCallChunkQuery {
  string node_id = 1;
  uint64 start_chunk_id = 2;
  uint32 max_chunks = 3;
  int64 seek_timestamp_unix_nano = 4;
  bool forward = 5;
}

message NoxApiCallChunkResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  repeated NoxApiCallChunk chunks = 2;
  bool has_more = 3;
}

message NoxApiCallChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  uint64 first_seq = 3;
  uint64 last_seq = 4;
  int64 first_ts_unix_nano = 5;
  int64 last_ts_unix_nano = 6;
  uint32 record_count = 7;
  bool sealed = 8;
  bytes zstd_records = 9;       // Compressed NoxApiCallRecordList
  uint32 raw_size = 10;
}

message NoxApiCallRecordList {
  repeated NoxRawApiCallRecord records = 1;
}

// ------------------------------------------------------------------------------
// Direct Interaction ("MADTOM" user / "Control Center" user ID)
// ------------------------------------------------------------------------------
message NoxDirectMessageRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = dedicated Control Center sandbox; or target real chat
  string text = 3;
  repeated NoxImageData attachments = 4;
  string reply_to_handle = 5;   // optional handle or message id
}

message NoxDirectTurnEvent {
  int64 timestamp_unix_nano = 1;
  string event_type = 2;        // "token_delta", "thought", "reply", "reaction", "sticker", "gif", "remember", "forget", "hot", "tool_call", "tool_result", "finish"
  string content = 3;
  map<string, string> attributes = 4;
  bool is_final = 5;
}

message NoxTurnTagEvent {
  int64 chat_id = 1;
  int64 timestamp_unix_nano = 2;
  string tag_name = 3;
  string content = 4;
  map<string, string> attributes = 5;
}

message NoxChatHistoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  uint32 limit = 3;
}

message NoxMessageItem {
  int64 id = 1;
  int64 chat_id = 2;
  int64 message_id = 3;
  string user_id = 4;
  string sender_name = 5;
  string sender_username = 6;
  string text = 7;
  bool is_bot = 8;
  string media_kind = 9;
  string media_unique_id = 10;
  int64 created_at_unix_sec = 11;
}

message NoxChatHistoryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxMessageItem messages = 1;
}

message NoxListChatsRequest {
  string node_id = 1;
}

message NoxChatItem {
  int64 chat_id = 1;
  string chat_type = 2;
  string title = 3;
  string trigger_nicknames = 4;
  int32 auto_reply_interval = 5;
  int64 last_active_unix_sec = 6;
}

message NoxListChatsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxChatItem chats = 1;
}

// ------------------------------------------------------------------------------
// Memories, RAG & Hot Memory
// ------------------------------------------------------------------------------
message NoxMemoryQueryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string category = 3;
  string query = 4;
  bool active_only = 5;
  uint32 limit = 6;
  uint32 offset = 7;
}

message NoxAtomicMemoryItem {
  string id = 1;
  int64 chat_id = 2;
  string category = 3;
  string entity_key = 4;
  string content = 5;
  double importance = 6;
  double confidence = 7;
  bool is_active = 8;
  int64 created_at_unix_sec = 9;
  int64 updated_at_unix_sec = 10;
  repeated float vector_preview = 11; // first 8 dimensions for quick inspection
}

message NoxMemoryQueryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxAtomicMemoryItem memories = 1;
  uint32 total_count = 2;
}

message NoxHybridSearchRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string query_text = 3;
  uint32 limit = 4;
}

message NoxHybridSearchResultItem {
  NoxAtomicMemoryItem memory = 1;
  double rrf_score = 2;
  double dense_score = 3;
  uint32 sparse_rank = 4;
}

message NoxHybridSearchResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxHybridSearchResultItem results = 1;
}

message NoxUpsertMemoryRequest {
  string node_id = 1;
  string id = 2;                // empty to create
  int64 chat_id = 3;
  string category = 4;
  string entity_key = 5;
  string content = 6;
  double importance = 7;
  bool is_active = 8;
}

message NoxDeleteMemoryRequest {
  string node_id = 1;
  string id = 2;
  bool hard_delete = 3;
}

message NoxMemoryMutationResponse {
  bool success = 1;
  string memory_id = 2;
  string message = 3;
}

message NoxHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
}

message NoxHotMemoryItem {
  int64 chat_id = 1;
  string key = 2;
  string content = 3;
  int64 updated_at_unix_sec = 4;
  int64 expires_at_unix_sec = 5;
}

message NoxHotMemoryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxHotMemoryItem items = 1;
}

message NoxUpsertHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string key = 3;
  string content = 4;
}

message NoxDeleteHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string key = 3;
}

// ------------------------------------------------------------------------------
// Media Library (Stickers & GIFs)
// ------------------------------------------------------------------------------
message NoxMediaQueryRequest {
  string node_id = 1;
  string kind = 2;              // "sticker", "gif", or "" for all
  int64 scope = 3;
  string query = 4;             // semantic search query
  uint32 limit = 5;
  uint32 offset = 6;
}

message NoxMediaLibraryItem {
  string file_unique_id = 1;
  string file_id = 2;
  string kind = 3;              // "sticker" or "gif"
  int64 scope = 4;
  string set_name = 5;
  uint32 pack_index = 6;
  string emoji = 7;
  string format = 8;
  string caption_json = 9;
  string caption_text = 10;
  bool nsfw = 11;
  bool dead = 12;
  uint32 use_count = 13;
  int64 last_used_at_unix_sec = 14;
  int32 pinned_slot = 15;       // 0 if unpinned, 1..3 if pinned
  bool in_library = 16;         // true if added to Nox's active media_library, false if only in pack captions
}

message NoxMediaQueryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxMediaLibraryItem items = 1;
  uint32 total_count = 2;
  repeated NoxStickerPackItem sticker_packs = 3;
}

message NoxStickerPackItem {
  string set_name = 1;
  string title = 2;
  uint32 sticker_count = 3;
  string analyzed_at = 4;
}

message NoxForceAddStickerRequest {
  string node_id = 1;
  int64 scope = 2;
  string file_id = 3;
  string file_unique_id = 4;
  string set_name = 5;
  string emoji = 6;
  string caption_text = 7;
  string kind = 8;
}

message NoxMediaPreviewRequest {
  string node_id = 1;
  string file_unique_id = 2;
}

message NoxMediaPreviewResponse {
  string file_unique_id = 1;
  string mime_type = 2;
  bytes image_bytes = 3;
}

message NoxMediaMutationRequest {
  string node_id = 1;
  string file_unique_id = 2;
  string caption_text = 3;
  string caption_json = 4;
  bool is_nsfw = 5;
  bool is_dead = 6;
  bool in_library = 7;
  bool update_library_membership = 8;
}

message NoxMediaPinRequest {
  string node_id = 1;
  int64 scope = 2;
  string kind = 3;
  string file_unique_id = 4;
  int32 slot = 5;               // 1..3; 0 to unpin
  string note = 6;
}

message NoxMediaMutationResponse {
  bool success = 1;
  string message = 2;
}

message NoxAnalyzePackRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string set_name = 3;
  string reason = 4;
}

message NoxAnalyzePackResponse {
  bool success = 1;
  string job_id = 2;
  string message = 3;
}

// ------------------------------------------------------------------------------
// Active Jobs & Vector Explorer
// ------------------------------------------------------------------------------
message NoxActiveJobsRequest {
  string node_id = 1;
}

message NoxJobProgressEvent {
  string job_id = 1;
  string job_type = 2;          // "audio_stt", "sound_classifier", "song_recognize", "sticker_map", "sticker_reduce", "embedding"
  int64 chat_id = 3;
  string status = 4;            // "queued", "running", "completed", "failed"
  double progress = 5;          // 0.0 .. 1.0
  string details = 6;
  int64 elapsed_ms = 7;
}

message NoxActiveJobsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxJobProgressEvent active_jobs = 1;
}

message NoxVectorInspectRequest {
  string node_id = 1;
  string collection_name = 2;   // "nox_memories", "stickers", "gifs"
  string point_id = 3;
  uint32 top_k_neighbors = 4;
}

message NoxVectorPointItem {
  string point_id = 1;
  string collection_name = 2;
  uint32 vector_dim = 3;
  double vector_norm = 4;
  repeated float vector_sample = 5;
  map<string, string> payload = 6;
  double similarity = 7;
  repeated NoxMessageItem related_messages = 8;
}

message NoxVectorInspectResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  NoxVectorPointItem target_point = 1;
  repeated NoxVectorPointItem neighbors = 2;
}
