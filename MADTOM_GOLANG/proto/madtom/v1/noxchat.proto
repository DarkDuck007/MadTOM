syntax = "proto3";

package madtom.v1;

import "madtom/v1/logs.proto";
import "madtom/v1/query.proto";

option go_package = "github.com/DarkDuck007/madtom/pkg/proto/v1;madtomv1";
option csharp_namespace = "MADTOM.Plugins.NoxAI.Proto.V1";

// ==============================================================================
// NoxChatControlService
// Full control plane for NoxAI / NoxChat node administration, telemetry,
// direct interaction, memories, libraries, raw API payloads, and jobs.
// ==============================================================================
service NoxChatControlService {
  // Handshake, Node Info, Transport Compression Stats, and Live Config
  rpc GetNodeStatus(NoxNodeStatusRequest) returns (NoxNodeStatusResponse);
  rpc UpdateControlConfig(NoxUpdateControlConfigRequest) returns (NoxNodeStatusResponse);

  // Asynchronous Zstd-Chunked Live Streams (1MB State/Telemetry Buffer / 8MB Log/API Buffer)
  rpc SubscribeState(NoxStateSubscriptionRequest) returns (stream NoxStateChunk);
  rpc SubscribeLogsAndApi(NoxLogApiSubscriptionRequest) returns (stream NoxLogApiChunk);

  // Historical Usage & Python Runtime Telemetry Query (LTTB Downsampled for MetricHistoryChartControl)
  rpc QueryTelemetryRange(RangeQueryRequest) returns (RangeQueryResponse);

  // Historical Spool Paging (from 1GB Server-Side WAL Spool when store_raw_logs is enabled)
  rpc GetSpoolStats(NoxSpoolStatsRequest) returns (NoxSpoolStatsResponse);
  rpc SearchLogs(NoxSearchLogsRequest) returns (NoxSearchLogsResponse);
  rpc QueryLogChunks(LogChunkQuery) returns (LogChunkResponse);
  rpc QueryApiCallChunks(NoxApiCallChunkQuery) returns (NoxApiCallChunkResponse);
  rpc GetApiCallDetail(NoxApiCallDetailRequest) returns (NoxRawApiCallRecord);
  rpc QueryChatTrace(NoxChatTraceRequest) returns (NoxChatTraceResponse);
  rpc ClearSpool(NoxClearSpoolRequest) returns (NoxClearSpoolResponse);

  // Direct Chat Interaction (User: "MADTOM", UserID: "Control Center")
  rpc SendDirectMessage(NoxDirectMessageRequest) returns (stream NoxDirectTurnEvent);
  rpc GetChatHistory(NoxChatHistoryRequest) returns (NoxChatHistoryResponse);
  rpc ListChats(NoxListChatsRequest) returns (NoxListChatsResponse);

  // RAG, Atomic Memories & Hot Memory Inspection + Modification
  rpc QueryMemories(NoxMemoryQueryRequest) returns (NoxMemoryQueryResponse);
  rpc SearchMemoriesHybrid(NoxHybridSearchRequest) returns (NoxHybridSearchResponse);
  rpc UpsertMemory(NoxUpsertMemoryRequest) returns (NoxMemoryMutationResponse);
  rpc DeleteMemory(NoxDeleteMemoryRequest) returns (NoxMemoryMutationResponse);
  rpc ListHotMemories(NoxHotMemoryRequest) returns (NoxHotMemoryResponse);
  rpc UpsertHotMemory(NoxUpsertHotMemoryRequest) returns (NoxHotMemoryResponse);
  rpc DeleteHotMemory(NoxDeleteHotMemoryRequest) returns (NoxHotMemoryResponse);

  // Stickers, GIFs, Libraries & Vector Inspection + Modification
  rpc QueryMediaLibrary(NoxMediaQueryRequest) returns (NoxMediaQueryResponse);
  rpc GetMediaAssetPreview(NoxMediaPreviewRequest) returns (NoxMediaPreviewResponse);
  rpc MutateMediaItem(NoxMediaMutationRequest) returns (NoxMediaMutationResponse);
  rpc ManageMediaPin(NoxMediaPinRequest) returns (NoxMediaMutationResponse);
  rpc TriggerStickerPackAnalysis(NoxAnalyzePackRequest) returns (NoxAnalyzePackResponse);
  rpc ForceAddSticker(NoxForceAddStickerRequest) returns (NoxMediaMutationResponse);

  // Active Jobs & Vector Store Explorer
  rpc GetActiveJobs(NoxActiveJobsRequest) returns (NoxActiveJobsResponse);
  rpc InspectVectors(NoxVectorInspectRequest) returns (NoxVectorInspectResponse);

  // Chat Images (Image Studio storage; images are strictly chat-bound)
  rpc ListChatImages(NoxListChatImagesRequest) returns (NoxListChatImagesResponse);
  rpc GetChatImage(NoxGetChatImageRequest) returns (NoxGetChatImageResponse);
  rpc GetImageStorageStats(NoxImageStorageStatsRequest) returns (NoxImageStorageStatsResponse);
  rpc SweepChatImages(NoxSweepChatImagesRequest) returns (NoxSweepChatImagesResponse);

  // Chat Files (Unified Workspace storage: IMG, VID, DOC, FILE; chat-bound)
  rpc ListChatFiles(NoxListChatFilesRequest) returns (NoxListChatFilesResponse);
  rpc GetChatFilePreview(NoxGetChatFilePreviewRequest) returns (NoxGetChatFilePreviewResponse);
  rpc GetChatFileBytes(NoxGetChatFileBytesRequest) returns (NoxGetChatFileBytesResponse);
  rpc GetWorkspaceStorageStats(NoxWorkspaceStorageStatsRequest) returns (NoxWorkspaceStorageStatsResponse);
  rpc SweepChatFiles(NoxSweepChatFilesRequest) returns (NoxSweepChatFilesResponse);

  // User Profiles & Avatars
  rpc QueryUserProfiles(NoxUserProfileQueryRequest) returns (NoxUserProfileQueryResponse);
  rpc SearchUserProfiles(NoxUserProfileSearchRequest) returns (NoxUserProfileSearchResponse);
  rpc GetUserProfilePhoto(NoxUserProfilePhotoRequest) returns (NoxUserProfilePhotoResponse);

  // Tips (short prompt tips in their own vector space; scope: global / one chat / one persona)
  rpc ListTips(NoxTipListRequest) returns (NoxTipListResponse);
  rpc SearchTips(NoxTipSearchRequest) returns (NoxTipSearchResponse);
  rpc AddTips(NoxAddTipsRequest) returns (NoxAddTipsResponse);
  rpc UpdateTip(NoxUpdateTipRequest) returns (NoxTipMutationResponse);
  rpc DeleteTips(NoxDeleteTipsRequest) returns (NoxTipMutationResponse);
  rpc TestTips(NoxTestTipsRequest) returns (NoxTestTipsResponse);
}

// ------------------------------------------------------------------------------
// Node Status & Config
// ------------------------------------------------------------------------------
message NoxNodeStatusRequest {
  string node_id = 1;
}

message NoxNodeStatusResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  string hostname = 2;
  string noxchat_version = 3;
  string probe_version = 4;
  string python_version = 5;
  int64 uptime_seconds = 6;
  bool bot_running = 7;
  bool store_raw_logs = 8;
  uint64 max_spool_bytes = 9;
  uint64 current_spool_bytes = 10;
  uint64 state_buffer_bytes = 11;
  uint64 log_buffer_bytes = 12;
  repeated TransportCompressionStats transport_stats = 13;
}

message NoxUpdateControlConfigRequest {
  string node_id = 1;
  bool store_raw_logs = 2;
  uint64 max_spool_bytes = 3;
}

// ------------------------------------------------------------------------------
// Streamed Chunks
// ------------------------------------------------------------------------------
message NoxStateSubscriptionRequest {
  string node_id = 1;
}

// Zstd-compressed batch of state, telemetry, and job progress events (1MB buffer cap)
message NoxStateChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  int64 timestamp_unix_nano = 3;
  bytes zstd_payload = 4;       // Compressed NoxStateChunkPayload
  uint32 decoded_size = 5;
  uint64 dropped_chunks = 6;    // Non-zero if slow consumer caused ring buffer drops
}

message NoxStateChunkPayload {
  repeated NoxTelemetrySample telemetry_samples = 1;
  repeated NoxJobProgressEvent job_events = 2;
  repeated NoxTurnTagEvent live_turn_events = 3;
}

message NoxLogApiSubscriptionRequest {
  string node_id = 1;
  bool include_raw_api_calls = 2;
  bool include_images = 3;
}

// Zstd-compressed batch of system/bot logs and raw LLM API calls (8MB buffer cap)
message NoxLogApiChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  int64 timestamp_unix_nano = 3;
  bytes zstd_payload = 4;       // Compressed LogChunk or NoxApiCallChunk
  uint32 decoded_size = 5;
  uint64 dropped_chunks = 6;
  string chunk_kind = 7;        // "log" or "api"
}

message NoxLogApiChunkPayload {
  repeated LogRecord log_records = 1;
  repeated NoxRawApiCallRecord api_call_records = 2;
}

// ------------------------------------------------------------------------------
// Telemetry & Usage Metrics
// ------------------------------------------------------------------------------
message NoxTelemetrySample {
  int64 timestamp_unix_nano = 1;
  map<string, double> metrics = 2;
}

// ------------------------------------------------------------------------------
// Raw LLM API Call Inspection (with Multimodal Image Support)
// ------------------------------------------------------------------------------
message NoxRawApiCallRecord {
  string call_id = 1;
  int64 timestamp_unix_nano = 2;
  string caller = 3;            // "main_agent", "sticker_map", "sticker_reduce", "memory_retry", "audio_status"
  string model = 4;
  string base_url = 5;
  double temperature = 6;
  uint32 duration_ms = 7;
  uint32 prompt_tokens = 8;
  uint32 completion_tokens = 9;
  uint32 cached_tokens = 10;
  string raw_request_json = 11;
  string raw_response_json = 12;
  repeated NoxImageData image_data_urls = 13; // extracted base64 JPEG data URIs
  string error_message = 14;
  string chat_name = 15;
  NoxTraceContext trace_context = 16;
}

// Identity is explicit: chat 0 is the Control Center sandbox, absent means unknown.
message NoxTraceContext {
  optional int64 chat_id = 1;
  string session_id = 2;
  string run_id = 3;
  optional int64 turn_index = 4;
  optional int64 step_index = 5;
  string conversation_id = 6;
  bool is_bootstrap = 7;
  repeated int64 triggering_message_ids = 8;
}

message NoxChatTraceEvent {
  string event_id = 1;
  NoxTraceContext trace_context = 2;
  int64 timestamp_unix_nano = 3;
  string kind = 4;
  string content = 5;
  map<string, string> attributes = 6;
  string related_call_id = 7;
}

message NoxChatTraceRequest {
  string node_id = 1;
  optional int64 chat_id = 2;
  string session_id = 3;
  string run_id = 4;
  uint32 limit = 5;
  string cursor = 6;
}

message NoxChatTraceResponse {
  repeated NoxRawApiCallRecord calls = 1; // metadata only; bodies use GetApiCallDetail
  repeated NoxChatTraceEvent events = 2;
  string next_cursor = 3;
  bool snapshot_complete = 4;
  int64 oldest_timestamp_unix_nano = 5;
  int64 newest_timestamp_unix_nano = 6;
  string notice = 7;
}

message NoxImageData {
  string label = 1;             // e.g. "User Photo #142", "Sticker Map 2x2 Grid"
  string mime_type = 2;         // "image/jpeg", "image/png"
  bytes image_bytes = 3;        // decoded binary image for fast client rendering
}

message NoxSpoolStatsRequest {
  string node_id = 1;
}

message NoxSpoolStatsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  uint64 total_spool_bytes = 2;
  uint64 max_spool_bytes = 3;
  uint64 total_log_records = 4;
  uint64 total_api_calls = 5;
  int64 oldest_ts_unix_nano = 6;
  int64 newest_ts_unix_nano = 7;
}

message NoxApiCallChunkQuery {
  string node_id = 1;
  uint64 start_chunk_id = 2;
  uint32 max_chunks = 3;
  int64 seek_timestamp_unix_nano = 4;
  bool forward = 5;
  bool summary_only = 6;
}

message NoxApiCallDetailRequest {
  string node_id = 1;
  string call_id = 2;
}

message NoxApiCallChunkResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  string node_id = 1;
  repeated NoxApiCallChunk chunks = 2;
  bool has_more = 3;
}

message NoxClearSpoolRequest {
  string node_id = 1;
  bool clear_logs = 2;
  bool clear_api_calls = 3;
}

message NoxClearSpoolResponse {
  bool success = 1;
  string message = 2;
}

message NoxApiCallChunk {
  string node_id = 1;
  uint64 chunk_id = 2;
  uint64 first_seq = 3;
  uint64 last_seq = 4;
  int64 first_ts_unix_nano = 5;
  int64 last_ts_unix_nano = 6;
  uint32 record_count = 7;
  bool sealed = 8;
  bytes zstd_records = 9;       // Compressed NoxApiCallRecordList
  uint32 raw_size = 10;
}

message NoxApiCallRecordList {
  repeated NoxRawApiCallRecord records = 1;
}

// ------------------------------------------------------------------------------
// Direct Interaction ("MADTOM" user / "Control Center" user ID)
// ------------------------------------------------------------------------------
message NoxDirectMessageRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = dedicated Control Center sandbox; or target real chat
  string text = 3;
  repeated NoxImageData attachments = 4;
  string reply_to_handle = 5;   // optional handle or message id
}

message NoxDirectTurnEvent {
  int64 timestamp_unix_nano = 1;
  string event_type = 2;        // "token_delta", "thought", "reply", "reaction", "sticker", "gif", "remember", "forget", "hot", "tool_call", "tool_result", "finish"
  string content = 3;
  map<string, string> attributes = 4;
  bool is_final = 5;
}

message NoxTurnTagEvent {
  int64 chat_id = 1;
  int64 timestamp_unix_nano = 2;
  string tag_name = 3;
  string content = 4;
  map<string, string> attributes = 5;
}

message NoxChatHistoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  uint32 limit = 3;
  string cursor = 4;
  bool include_archived = 5;
  bool paged = 6; // false preserves the original recent-message endpoint
}

message NoxMessageItem {
  int64 id = 1;
  int64 chat_id = 2;
  int64 message_id = 3;
  string user_id = 4;
  string sender_name = 5;
  string sender_username = 6;
  string text = 7;
  bool is_bot = 8;
  string media_kind = 9;
  string media_unique_id = 10;
  int64 created_at_unix_sec = 11;
}

message NoxChatHistoryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxMessageItem messages = 1;
  string next_cursor = 2;
  bool pagination_supported = 3;
  bool timestamps_reliable = 4;
  bool snapshot_complete = 5;
}

message NoxListChatsRequest {
  string node_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message NoxChatItem {
  int64 chat_id = 1;
  string chat_type = 2;
  string title = 3;
  string trigger_nicknames = 4;
  int32 auto_reply_interval = 5;
  int64 last_active_unix_sec = 6;
}

message NoxListChatsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxChatItem chats = 1;
  string next_cursor = 2;
  bool pagination_supported = 3;
  bool snapshot_complete = 4;
}

// ------------------------------------------------------------------------------
// Memories, RAG & Hot Memory
// ------------------------------------------------------------------------------
message NoxMemoryQueryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string category = 3;
  string query = 4;
  bool active_only = 5;
  uint32 limit = 6;
  uint32 offset = 7;
}

message NoxAtomicMemoryItem {
  string id = 1;
  int64 chat_id = 2;
  string category = 3;
  string entity_key = 4;
  string content = 5;
  double importance = 6;
  double confidence = 7;
  bool is_active = 8;
  int64 created_at_unix_sec = 9;
  int64 updated_at_unix_sec = 10;
  repeated float vector_preview = 11; // first 8 dimensions for quick inspection
}

message NoxMemoryQueryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxAtomicMemoryItem memories = 1;
  uint32 total_count = 2;
}

message NoxHybridSearchRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string query_text = 3;
  uint32 limit = 4;
}

message NoxHybridSearchResultItem {
  NoxAtomicMemoryItem memory = 1;
  double rrf_score = 2;
  double dense_score = 3;
  uint32 sparse_rank = 4;
}

message NoxHybridSearchResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxHybridSearchResultItem results = 1;
}

message NoxUpsertMemoryRequest {
  string node_id = 1;
  string id = 2;                // empty to create
  int64 chat_id = 3;
  string category = 4;
  string entity_key = 5;
  string content = 6;
  double importance = 7;
  bool is_active = 8;
}

message NoxDeleteMemoryRequest {
  string node_id = 1;
  string id = 2;
  bool hard_delete = 3;
}

message NoxMemoryMutationResponse {
  bool success = 1;
  string memory_id = 2;
  string message = 3;
}

message NoxHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
}

message NoxHotMemoryItem {
  int64 chat_id = 1;
  string key = 2;
  string content = 3;
  int64 updated_at_unix_sec = 4;
  int64 expires_at_unix_sec = 5;
}

message NoxHotMemoryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxHotMemoryItem items = 1;
}

message NoxUpsertHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string key = 3;
  string content = 4;
}

message NoxDeleteHotMemoryRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string key = 3;
}

// ------------------------------------------------------------------------------
// Media Library (Stickers & GIFs)
// ------------------------------------------------------------------------------
message NoxMediaQueryRequest {
  string node_id = 1;
  string kind = 2;              // "sticker", "gif", or "" for all
  int64 scope = 3;
  string query = 4;             // semantic search query
  uint32 limit = 5;
  uint32 offset = 6;
}

message NoxMediaLibraryItem {
  string file_unique_id = 1;
  string file_id = 2;
  string kind = 3;              // "sticker" or "gif"
  int64 scope = 4;
  string set_name = 5;
  uint32 pack_index = 6;
  string emoji = 7;
  string format = 8;
  string caption_json = 9;
  string caption_text = 10;
  bool nsfw = 11;
  bool dead = 12;
  uint32 use_count = 13;
  int64 last_used_at_unix_sec = 14;
  int32 pinned_slot = 15;       // 0 if unpinned, 1..3 if pinned
  bool in_library = 16;         // true if added to Nox's active media_library, false if only in pack captions
}

message NoxMediaQueryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxMediaLibraryItem items = 1;
  uint32 total_count = 2;
  repeated NoxStickerPackItem sticker_packs = 3;
}

message NoxStickerPackItem {
  string set_name = 1;
  string title = 2;
  uint32 sticker_count = 3;
  string analyzed_at = 4;
}

message NoxForceAddStickerRequest {
  string node_id = 1;
  int64 scope = 2;
  string file_id = 3;
  string file_unique_id = 4;
  string set_name = 5;
  string emoji = 6;
  string caption_text = 7;
  string kind = 8;
}

message NoxMediaPreviewRequest {
  string node_id = 1;
  string file_unique_id = 2;
}

message NoxMediaPreviewResponse {
  string file_unique_id = 1;
  string mime_type = 2;
  bytes image_bytes = 3;
}

message NoxMediaMutationRequest {
  string node_id = 1;
  string file_unique_id = 2;
  string caption_text = 3;
  string caption_json = 4;
  bool is_nsfw = 5;
  bool is_dead = 6;
  bool in_library = 7;
  bool update_library_membership = 8;
}

message NoxMediaPinRequest {
  string node_id = 1;
  int64 scope = 2;
  string kind = 3;
  string file_unique_id = 4;
  int32 slot = 5;               // 1..3; 0 to unpin
  string note = 6;
}

message NoxMediaMutationResponse {
  bool success = 1;
  string message = 2;
}

message NoxAnalyzePackRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string set_name = 3;
  string reason = 4;
}

message NoxAnalyzePackResponse {
  bool success = 1;
  string job_id = 2;
  string message = 3;
}

// ------------------------------------------------------------------------------
// Active Jobs & Vector Explorer
// ------------------------------------------------------------------------------
message NoxActiveJobsRequest {
  string node_id = 1;
}

message NoxJobProgressEvent {
  string job_id = 1;
  string job_type = 2;          // "audio_stt", "sound_classifier", "song_recognize", "sticker_map", "sticker_reduce", "embedding", "sticker_pack_analysis", "image_studio"
  int64 chat_id = 3;
  string status = 4;            // "queued", "running", "completed", "failed", "cancelled", "interrupted"
  double progress = 5;          // 0.0 .. 1.0
  string details = 6;
  int64 elapsed_ms = 7;
}

message NoxActiveJobsResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxJobProgressEvent active_jobs = 1;
}

message NoxVectorInspectRequest {
  string node_id = 1;
  string collection_name = 2;   // "nox_memories", "stickers", "gifs"
  string point_id = 3;
  uint32 top_k_neighbors = 4;
}

message NoxVectorPointItem {
  string point_id = 1;
  string collection_name = 2;
  uint32 vector_dim = 3;
  double vector_norm = 4;
  repeated float vector_sample = 5;
  map<string, string> payload = 6;
  double similarity = 7;
  repeated NoxMessageItem related_messages = 8;
}

message NoxVectorInspectResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  NoxVectorPointItem target_point = 1;
  repeated NoxVectorPointItem neighbors = 2;
}

// ------------------------------------------------------------------------------
// Chat Images (Image Studio)
// Field names mirror the NoxChat Python RPC JSON (snake_case) so the probe can
// unmarshal the bridge payload directly.
// ------------------------------------------------------------------------------
message NoxChatImage {
  string uuid = 1;
  string handle = 2;
  int64 chat_id = 3;
  string origin = 4;            // "telegram" or "generated"
  int32 width = 5;
  int32 height = 6;
  int64 bytes = 7;              // size on disk
  string mime_type = 8;
  int64 source_message_id = 9;
  string job_id = 10;
  string description = 11;
  string created_at = 12;       // ISO-8601
  string last_used_at = 13;     // ISO-8601
}

message NoxListChatImagesRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = all chats
  uint32 limit = 3;
  uint32 offset = 4;
  string origin = 5;            // "", "telegram" or "generated"
}

message NoxListChatImagesResponse {
  repeated NoxChatImage images = 1;
}

message NoxGetChatImageRequest {
  string node_id = 1;
  int64 chat_id = 2;            // required: images are chat-bound
  string uuid = 3;
  uint32 max_dimension = 4;     // 0 = original bytes, > 0 = JPEG thumbnail
}

message NoxGetChatImageResponse {
  NoxChatImage image = 1;
  string mime_type = 2;
  bytes image_bytes = 3;
}

message NoxImageStorageStatsRequest {
  string node_id = 1;
}

message NoxChatImageUsage {
  int64 chat_id = 1;
  uint32 image_count = 2;
  int64 total_bytes = 3;
  string oldest = 4;
  string newest = 5;
}

message NoxImageStorageStatsResponse {
  int64 total_bytes = 1;
  uint32 image_count = 2;
  int64 max_total_bytes = 3;
  int64 max_bytes_per_chat = 4;
  repeated NoxChatImageUsage chats = 5;
}

message NoxSweepChatImagesRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = all chats (not allowed together with uuids)
  repeated string uuids = 3;    // optional explicit deletions; requires chat_id
  double older_than_days = 4;   // 0 = no age filter
  uint32 keep_recent = 5;       // newest N per chat are kept
  bool dry_run = 6;
}

message NoxSweepChatImagesResponse {
  uint32 deleted_count = 1;
  int64 freed_bytes = 2;
}

// ------------------------------------------------------------------------------
// Chat Files (Unified Workspace Storage: IMG, VID, DOC, FILE)
// Field names mirror the NoxChat Python RPC JSON (snake_case) so the probe can
// unmarshal the bridge payload directly.
// ------------------------------------------------------------------------------
message NoxChatFile {
  string uuid = 1;
  string handle = 2;            // "IMG-...", "VID-...", "DOC-...", "FILE-..."
  string store = 3;             // "image" | "document" | "file"
  string kind = 4;              // "image" | "animation" | "video" | "pdf" | "pptx" | "docx" | "xlsx" | "csv" | "txt" | "md" | "json" | "other"
  string role = 5;              // "primary" | "companion_pdf" | ""
  int64 chat_id = 6;
  string filename = 7;
  string mime_type = 8;
  int64 bytes = 9;              // size on disk
  int64 source_bundle_bytes = 10;
  int32 width = 11;
  int32 height = 12;
  int32 page_count = 13;
  double duration_s = 14;
  bool has_audio = 15;
  string origin = 16;           // "telegram", "generated", "studio", "job_input"
  int64 source_message_id = 17;
  string job_id = 18;
  string description = 19;
  string created_at = 20;       // ISO-8601
  string last_used_at = 21;     // ISO-8601
  bool pinned = 22;
}

message NoxListChatFilesRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = all chats
  uint32 limit = 3;
  uint32 offset = 4;
  string kind_filter = 5;       // optional: "image", "video", "pdf", "pptx", "document", etc.
  string origin = 6;            // optional: "telegram", "generated", etc.
}

message NoxListChatFilesResponse {
  repeated NoxChatFile files = 1;
  uint32 total_count = 2;
}

message NoxGetChatFilePreviewRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string uuid = 3;              // uuid or handle
  string mode = 4;              // "thumbnail" | "page" | "anim" | "text" | "raw"
  uint32 max_dimension = 5;     // 0 = original/full, > 0 = thumbnail/render max dimension
  uint32 page = 6;              // 1-based page/slide index
}

message NoxGetChatFilePreviewResponse {
  NoxChatFile file = 1;
  string mime_type = 2;
  bytes preview_bytes = 3;      // JPEG/PNG thumbnail, page render, or NOXANIM1 binary payload
  string text_content = 4;      // UTF-8 text preview snippet
  uint32 page_count = 5;
  uint32 current_page = 6;
  uint32 frame_count = 7;
}

message NoxGetChatFileBytesRequest {
  string node_id = 1;
  int64 chat_id = 2;
  string uuid = 3;
}

message NoxGetChatFileBytesResponse {
  string filename = 1;
  string mime_type = 2;
  bytes file_bytes = 3;
  int64 total_bytes = 4;
}

message NoxWorkspaceStorageStatsRequest {
  string node_id = 1;
}

message NoxChatFileUsage {
  int64 chat_id = 1;
  uint32 file_count = 2;
  int64 total_bytes = 3;
  uint32 image_count = 4;
  uint32 video_count = 5;
  uint32 document_count = 6;
  uint32 saved_file_count = 7;
  string oldest = 8;
  string newest = 9;
}

message NoxWorkspaceStorageStatsResponse {
  int64 total_bytes = 1;
  uint32 file_count = 2;
  int64 max_total_bytes = 3;
  int64 max_bytes_per_chat = 4;
  int64 image_bytes = 5;
  int64 document_bytes = 6;
  int64 file_bytes = 7;
  repeated NoxChatFileUsage chats = 8;
}

message NoxSweepChatFilesRequest {
  string node_id = 1;
  int64 chat_id = 2;            // 0 = all chats
  repeated string uuids = 3;    // optional explicit deletions
  double older_than_days = 4;   // 0 = no age filter
  uint32 keep_recent = 5;       // newest N per chat are kept
  string kind_filter = 6;       // optional: filter sweep by kind/store
  bool dry_run = 7;
}

message NoxSweepChatFilesResponse {
  uint32 deleted_count = 1;
  int64 freed_bytes = 2;
  repeated string protected_job_files = 3;
}

// ------------------------------------------------------------------------------
// User Profiles & Avatars
// ------------------------------------------------------------------------------
message NoxUserProfile {
  int64 user_id = 1;
  string username = 2;
  string full_name = 3;
  string bio = 4;
  string photo_unique_id = 5;
  string photo_description = 6;
  string audio_title = 7;
  string audio_performer = 8;
  int32 audio_duration = 9;
  string birthdate = 10;
  string personal_chat_title = 11;
  string personal_chat_username = 12;
  string last_checked_at = 13;
  string created_at = 14;
  double relevance_score = 15;
}

message NoxUserProfileQueryRequest {
  string node_id = 1;
  uint32 limit = 2;
}

message NoxUserProfileQueryResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxUserProfile profiles = 1;
}

message NoxUserProfileSearchRequest {
  string node_id = 1;
  string query = 2;
  uint32 limit = 3;
}

message NoxUserProfileSearchResponse {
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;

  repeated NoxUserProfile profiles = 1;
}

message NoxUserProfilePhotoRequest {
  string node_id = 1;
  int64 user_id = 2;
}

message NoxUserProfilePhotoResponse {
  int64 user_id = 1;
  bytes photo_bytes = 2;
  string mime_type = 3;
}


// Literal message search; time interval is [start, end), zero means unbounded.
message NoxSearchLogsRequest {
 string node_id = 1;
 string query = 2;
 bool case_sensitive = 3;
 int64 start_time_nano = 4;
 int64 end_time_nano = 5;
 repeated uint32 priorities = 6;
 string unit = 7;
 uint32 limit = 8;
 string cursor = 9;
}
message NoxLogSearchHit {
 uint64 chunk_id = 1;
 uint64 seq = 2;
 int64 timestamp_unix_nano = 3;
 uint32 priority = 4;
 string unit = 5;
 string snippet = 6;
 // UTF-16 code units in snippet; zero length for metadata-only matches.
 uint32 match_start = 7;
 uint32 match_length = 8;
 bool message_truncated = 9;
}
message NoxSearchLogsResponse {
 repeated NoxLogSearchHit hits = 1;
 string next_cursor = 2;
 uint64 high_water_seq = 3;
 bool snapshot_complete = 4;
 string stop_reason = 5;
 uint64 scanned_chunks = 6;
 uint64 scanned_records = 7;
 uint64 scanned_bytes = 8;
 uint64 corrupt_chunks = 9;
 int64 took_ms = 10;
 string generation = 11;
}

// ==============================================================================
// Tips: short prompt tips retrieved by relevance to the recent chat messages.
// ==============================================================================
message NoxTipItem {
  string id = 1;                 // "T-1a2b3c4d"
  string text = 2;               // the tip shown to the model
  string trigger = 3;            // optional "when to use" text; matched instead of `text` when set
  string scope_kind = 4;         // "global" | "chat" | "persona"
  string scope_value = 5;        // "" | chat id as text | persona key (lower-case)
  string author = 6;             // "studio" | "nox"
  string status = 7;             // "active" | "proposed" (waiting for approval) | "rejected"
  bool enabled = 8;
  string state = 9;              // embedding state: "pending" | "ready" | "failed"
  string error = 10;             // embedding error when state == "failed"
  uint32 use_count = 11;
  int64 last_used_at_unix_sec = 12;
  int64 created_at_unix_sec = 13;
  int64 updated_at_unix_sec = 14;
  int64 created_chat_id = 15;    // chat where Nox wrote/proposed it (0 = n/a)
}

message NoxTipSettings {
  bool enabled = 1;
  double min_relevance = 2;
  uint32 max_tips = 3;
  uint32 max_tip_chars = 4;
  uint32 max_trigger_chars = 5;
  uint32 max_tips_per_chat = 6;
  uint32 query_messages = 7;
  uint32 repeat_after_turns = 8;
}

message NoxTipListRequest {
  string node_id = 1;
  string scope_kind = 2;         // "" = any
  string scope_value = 3;
  string status = 4;             // "" = any
  string state = 5;              // "" = any
  string author = 6;             // "" = any
  string text = 7;               // substring filter on text/trigger
  uint32 limit = 8;
  uint32 offset = 9;
}

message NoxTipListResponse {
  repeated NoxTipItem tips = 1;
  uint32 total_count = 2;
  uint32 queue_size = 3;         // tips still waiting to be embedded
  uint32 proposed_count = 4;     // tips waiting for approval (all scopes)
  NoxTipSettings settings = 5;
}

message NoxTipScored {
  NoxTipItem tip = 1;
  double score = 2;              // cosine similarity
}

message NoxTipSearchRequest {
  string node_id = 1;
  string query = 2;
  string scope_kind = 3;
  string scope_value = 4;
  uint32 limit = 5;
}

message NoxTipSearchResponse {
  repeated NoxTipScored results = 1;
}

message NoxAddTipsRequest {
  string node_id = 1;
  string raw_text = 2;           // one or many tips separated by a blank line; a first line "when: ..." is the trigger
  string scope_kind = 3;         // default "global"
  string scope_value = 4;
}

message NoxTipRejected {
  string text = 1;
  string reason = 2;             // empty | too_long | trigger_too_long | bad_scope | duplicate
}

message NoxAddTipsResponse {
  repeated NoxTipItem added = 1;
  repeated NoxTipRejected rejected = 2;
  uint32 queue_size = 3;
}

message NoxUpdateTipRequest {
  string node_id = 1;
  string id = 2;
  bool set_text = 3;
  string text = 4;
  bool set_trigger = 5;          // with an empty trigger: clear it
  string trigger = 6;
  bool set_enabled = 7;
  bool enabled = 8;
  string status = 9;             // "" = unchanged; "active" approves, "rejected" rejects
  bool set_scope = 10;
  string scope_kind = 11;
  string scope_value = 12;
}

message NoxDeleteTipsRequest {
  string node_id = 1;
  repeated string ids = 2;
}

message NoxTipMutationResponse {
  bool success = 1;
  string message = 2;            // reason code or human text on failure
  NoxTipItem tip = 3;            // the tip after an update
  uint32 affected = 4;           // rows deleted
  uint32 queue_size = 5;
}

message NoxTestTipsRequest {
  string node_id = 1;
  string text = 2;               // a chat snippet
  int64 chat_id = 3;             // 0 = no chat scope
  string persona_key = 4;        // "" = no persona scope
}

message NoxTestTipsResponse {
  double threshold = 1;
  repeated NoxTipScored shown = 2;
  repeated NoxTipScored below_threshold = 3;
}
