syntax = "proto3";

package madtom.v1;

import "madtom/v1/metrics.proto";
import "madtom/v1/logs.proto";

option go_package = "github.com/DarkDuck007/madtom/pkg/proto/v1;madtomv1";
option csharp_namespace = "MADTOM.Plugins.Telemetry.Proto.V1";

// QueryService exposes time-series querying and real-time streaming to the UI.
service QueryService {
  // Discovers all nodes registered with this collector.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // Resolution-adaptive historical metric query using LTTB downsampling.
  rpc QueryRange(RangeQueryRequest) returns (RangeQueryResponse);

  // Real-time 1Hz streaming feed for actively viewed cards/nodes.
  rpc SubscribeLive(LiveSubscriptionRequest) returns (stream LiveTelemetryEvent);

  // System logs query and streaming endpoints.
  rpc GetLogStats(LogStatsRequest) returns (LogStatsResponse);
  rpc QueryLogChunks(LogChunkQuery) returns (LogChunkResponse);
  rpc SubscribeLogs(LogSubscription) returns (stream LogChunk);
}

message ListNodesRequest {}

message NodeInfo {
  string node_id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string status = 5; // "ONLINE", "STALE", "OFFLINE"
  int64 last_seen_unix_nano = 6;
  string connection_mode = 7; // "PUSH", "PULL"
  string daemon_version = 8;
  repeated string supported_features = 9;
  string config_sync_status = 10;
}

message ListNodesResponse {
  // Negotiated response envelope; decoded content is this same message type.
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;
  string collector_name = 1;
  repeated NodeInfo nodes = 2;
  bool transport_stats_supported = 3;
  repeated TransportCompressionStats transport_stats = 4;
}

message RangeQueryRequest {
  string node_id = 1;
  string metric_name = 2; // e.g., "cpu.total", "memory.available", "nic.eth0.rx_bytes"
  int64 start_time_unix_nano = 3;
  int64 end_time_unix_nano = 4;
  uint32 target_points = 5; // LOD downsample budget (e.g. 1200)
}

message TimeSeriesPoint {
  int64 timestamp_unix_nano = 1;
  double value = 2;
  double min_value = 3;
  double max_value = 4;
}

message RangeQueryResponse {
  // Negotiated response envelope; decoded content is this same message type.
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;
  string node_id = 1;
  string metric_name = 2;
  repeated TimeSeriesPoint points = 3;
}

message LiveSubscriptionRequest {
  string node_id = 1;
  repeated string subscribed_categories = 2; // "cpu", "memory", "power", "network"
}

message LiveTelemetryEvent {
  // Negotiated response envelope; decoded content is this same message type.
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;
  string node_id = 1;
  string collector_name = 2;
  SystemMetrics metrics = 3;
}


// Collector-lifetime successfully decoded incoming payloads, including retries.
// Zstd ratio uses only compressed frames; bytes exclude outer protobuf/framing.
message TransportCompressionStats {
  string node_id = 1;
  string mode = 2;
  uint64 batches = 3;
  uint64 zstd_batches = 4;
  uint64 zstd_bytes = 5;
  uint64 decoded_zstd_bytes = 6;
  int64 last_seen_unix_nano = 7;
  uint64 raw_bytes = 8; // Serialized samples in frames sent without zstd.
  bool raw_bytes_supported = 9;
}

message LogStatsRequest {
  string node_id = 1;
}

message LogStatsResponse {
  // Negotiated response envelope; decoded content is this same message type.
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;
  string node_id = 1;
  uint64 first_seq = 2;
  uint64 last_seq = 3;
  uint64 total_records = 4;
  int64 oldest_ts_unix_nano = 5;
  int64 newest_ts_unix_nano = 6;
  uint64 total_bytes = 7;
}

message LogChunkQuery {
  string node_id = 1;
  uint64 start_chunk_id = 2;
  uint32 max_chunks = 3;              // e.g. 8 chunks = up to 2048 records
  int64 seek_timestamp_unix_nano = 4; // if > 0, collector seeks closest chunk
  bool forward = 5;                   // direction for range traversal
}

message LogChunkResponse {
  // Negotiated response envelope; decoded content is this same message type.
  bytes zstd_payload = 100;
  uint32 decoded_size = 101;
  string node_id = 1;
  repeated LogChunk chunks = 2;
  bool has_more = 3;
}

message LogSubscription {
  string node_id = 1;
  uint64 from_seq = 2;        // 0 = subscribe to live only; >0 = catch up from seq
  repeated string units = 3;  // optional filter
  uint32 max_priority = 4;    // optional filter (0 = any)
}

