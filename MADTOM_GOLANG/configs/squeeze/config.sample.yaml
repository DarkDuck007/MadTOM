# SQUEEZE Transcoder Daemon Configuration
# Run with: ./bin/squeeze-server --config config.sample.yaml

server:
  host: "0.0.0.0"
  port: 8080
  workers: 2
  queue_size: 128
  max_upload: 10737418240 # 10 GiB
  scratch: "/tmp/squeeze/scratch"
  output: "/tmp/squeeze/output"
  retention: "24h"
  upload_timeout: "30m"
  node_id: "RIG_ALPHA_01"
  mdns: true
  token: "" # Optional bearer token for authentication
  ffmpeg: "ffmpeg"
  ffprobe: "ffprobe"

# Server-side presets catalog exposed via GET /api/v1/presets
presets:
  # ============================================================================
  # 1. General Presets
  # ============================================================================
  - key: "fast1080"
    title: "Fast 1080p30 (Default)"
    category: "General"
    description: "Standard H.264 high-speed delivery profile."
    tag: "DEFAULT"
    spec:
      video_codec: "libx264"
      crf: 22
      preset: "medium"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 160
      width: 1920
      height: 1080
      fps: 30
      deinterlace: true

  - key: "ultra_compression"
    title: "Ultra Compression"
    category: "General"
    description: "Maximum space saving • H.264 CRF 30 • veryslow • tune film • hqdn3d denoise • 64k mono audio."
    tag: "TINY"
    spec:
      video_codec: "libx264"
      crf: 30
      preset: "veryslow"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 64
      audio_channels: 1
      tune: "film"
      denoise: "hqdn3d=1.5:1.5:6:6"
      deinterlace: false
      fps: 30
      width: 1280

  - key: "veryfast1080"
    title: "Very Fast 1080p30"
    category: "General"
    description: "High speed draft encode for fast client previews."
    spec:
      video_codec: "libx264"
      crf: 24
      preset: "veryfast"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 128
      width: 1920
      height: 1080
      fps: 30

  - key: "hq1080surround"
    title: "HQ 1080p30 Surround"
    category: "General"
    description: "H.264 High Profile • CRF 20.0 • Surround Audio."
    spec:
      video_codec: "libx264"
      crf: 20
      preset: "slow"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 320
      width: 1920
      height: 1080
      fps: 30

  - key: "superfast720"
    title: "Super Fast 720p30"
    category: "General"
    description: "Downscaled 720p rapid proxy generation."
    spec:
      video_codec: "libx264"
      crf: 26
      preset: "superfast"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 128
      width: 1280
      height: 720
      fps: 30

  - key: "ultrafast480"
    title: "Ultra Fast 480p30"
    category: "General"
    description: "Low-overhead reference proxy for slow networks."
    spec:
      video_codec: "libx264"
      crf: 28
      preset: "ultrafast"
      container: "mp4"
      audio_codec: "aac"
      audio_bitrate: 96
      width: 854
      height: 480
      fps: 30

  # ============================================================================
  # 2. Web Presets
  # ============================================================================
  - key: "discord"
    title: "Discord 8MB Target"
    category: "Web"
    description: "Optimized for Discord free file upload cap."
    tag: "WEB"
    spec:
